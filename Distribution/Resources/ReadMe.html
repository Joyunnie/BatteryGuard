<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
body { font: 14px -apple-system; line-height: 1.5; margin: 20px; }
h2 { font-size: 18px; }
li { margin: 7px 0; }
.warning { color: #9a4b00; font-weight: 600; }
</style></head><body>
<h2>설치 전에 확인하세요</h2>
<ul>
  <li>AlDente나 다른 배터리 제어 앱이 실행 중이면 먼저 그 앱에서 충전 제어를 해제하고 종료하세요.</li>
  <li>macOS 시스템 설정 → 배터리 → 충전(또는 배터리 성능 상태)에서 <strong>충전 한도</strong>를 끄세요.</li>
  <li>BatteryGuard가 제어를 맡는 동안 같은 화면의 <strong>최적화된 배터리 충전</strong>도 끄세요.</li>
</ul>
<p class="warning">BatteryGuard와 macOS/다른 앱이 동시에 충전을 제어하지 않게 하는 것이 중요합니다.</p>
<p>최초 실행은 안전한 모니터링 전용 상태입니다. 설치만으로 배터리 충전 상태를 바꾸지 않습니다.</p>
</body></html>
